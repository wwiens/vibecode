<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>vibecode</title>
  <style>
    :root {
      --bg: #fafafa;
      --fg: #1a1a1a;
      --muted: #6b6b6b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111;
        --fg: #f0f0f0;
        --muted: #9a9a9a;
      }
    }
    * { margin: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
    }
    h1 { font-size: 2.5rem; font-weight: 600; letter-spacing: -0.02em; }
    p { margin-top: 0.75rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>vibecode</h1>
    <p>Something new is on the way.</p>
  </main>
</body>
</html>
